{% if site.disqus %}
<section class="comments on-demand" aria-label="Comments" data-comments="{{ site.disqus | escape }}" data-page-url="{{ page.url | absolute_url }}">
  <button type="button" class="load-comments">Load comments</button>
  <p class="comments-status" role="status">Comments are provided by Disqus and load only when requested.</p>
  <div id="disqus_thread"></div>
  <noscript><p>Enable JavaScript to load comments.</p></noscript>
</section>
{% endif %}
